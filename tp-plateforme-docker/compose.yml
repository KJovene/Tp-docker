services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - whoami
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html/index.html:/usr/share/nginx/html/index.html:ro
      - nginx_logs:/var/log/nginx
    networks:
      - front_net

  whoami:
    image: traefik/whoami:v1.11
    restart: unless-stopped
    networks:
      - front_net
      - back_net

  dozzle:
    image: amir20/dozzle:v8.14.7
    restart: unless-stopped
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - front_net

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - kuma_data:/app/data
    depends_on:
      - nginx
      - whoami
      - redis
    networks:
      - front_net
      - back_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - back_net

networks:
  front_net:
    driver: bridge
  back_net:
    driver: bridge

volumes:
  kuma_data:
  redis_data:
  nginx_logs:
